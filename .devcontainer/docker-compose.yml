volumes:
  postgres-data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ..:/workspaces/commons:cached

    command: sleep infinity

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app-network

  db:
    image: postgres:16
    restart: unless-stopped

    networks:
      - app-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - postgres-data:/var/lib/postgresql/data

    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

networks:
  app-network:
    driver: bridge