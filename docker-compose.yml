services:
  postgres:
    image: postgres:17
    container_name: commons-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: commons_local_dev
    ports:
      - "5433:5432"
    volumes:
      - commons-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commons_local_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  commons-postgres-data:
    name: commons-postgres-data
